<style>
svg { display:block; width:100%; }
.rv { fill:#B5D4F4; stroke:#185FA5; stroke-width:1; cursor:default; }
.stop { fill:#CECBF6; stroke:#534AB7; stroke-width:1.5; cursor:pointer; transition:r .15s; }
.stop:hover { fill:#AFA9EC; r:9; }
.fac { fill:#9FE1CB; stroke:#0F6E56; stroke-width:1.5; cursor:pointer; }
.fac:hover { fill:#5DCAA5; }
.transit { stroke:#378ADD; stroke-width:2; fill:none; }
.transfer { stroke:#7F77DD; stroke-width:1.2; fill:none; stroke-dasharray:5 3; }
.walk-fac { stroke:#1D9E75; stroke-width:1.2; fill:none; stroke-dasharray:4 3; }
.xfer-stop { stroke:#888780; stroke-width:1; fill:none; stroke-dasharray:3 3; }
.tooltip { font-size:11px; fill:var(--color-text-primary); pointer-events:none; }
.legend-line { stroke-width:2; }
#info { font-size:12px; color:var(--color-text-secondary); margin:6px 0 0; min-height:18px; }
</style>

<svg id="g" viewBox="0 0 680 420">
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- ── Route 1: horizontal corridor (blue) ── -->
<polyline class="transit" points="50,130 130,130 210,130 300,130 390,130 470,130 560,130 630,130" marker-end="url(#arr)"/>
<!-- route 1 vertices -->
<circle class="rv" cx="50"  cy="130" r="4"/>
<circle class="rv" cx="130" cy="130" r="4"/>
<circle class="rv" cx="210" cy="130" r="4"/>
<circle class="rv" cx="300" cy="130" r="4"/>
<circle class="rv" cx="390" cy="130" r="4"/>
<circle class="rv" cx="470" cy="130" r="4"/>
<circle class="rv" cx="560" cy="130" r="4"/>
<circle class="rv" cx="630" cy="130" r="4"/>

<!-- ── Route 2: diagonal corridor ── -->
<polyline class="transit" points="80,60 160,100 260,150 360,200 440,240 520,280 600,320" marker-end="url(#arr)"/>
<circle class="rv" cx="80"  cy="60"  r="4"/>
<circle class="rv" cx="160" cy="100" r="4"/>
<circle class="rv" cx="260" cy="150" r="4"/>
<circle class="rv" cx="360" cy="200" r="4"/>
<circle class="rv" cx="440" cy="240" r="4"/>
<circle class="rv" cx="520" cy="280" r="4"/>
<circle class="rv" cx="600" cy="320" r="4"/>

<!-- ── Route 3: lower horizontal ── -->
<polyline class="transit" points="60,300 140,300 230,300 330,300 420,300 510,300 610,300" marker-end="url(#arr)"/>
<circle class="rv" cx="60"  cy="300" r="4"/>
<circle class="rv" cx="140" cy="300" r="4"/>
<circle class="rv" cx="230" cy="300" r="4"/>
<circle class="rv" cx="330" cy="300" r="4"/>
<circle class="rv" cx="420" cy="300" r="4"/>
<circle class="rv" cx="510" cy="300" r="4"/>
<circle class="rv" cx="610" cy="300" r="4"/>

<!-- ── Route 4: vertical corridor ── -->
<polyline class="transit" points="300,50 300,130 300,210 300,300 300,380" marker-end="url(#arr)"/>
<circle class="rv" cx="300" cy="50"  r="4"/>
<circle class="rv" cx="300" cy="210" r="4"/>
<circle class="rv" cx="300" cy="380" r="4"/>

<!-- ── Transfer edges: stops → nearest route vertex (dashed purple) ── -->
<!-- Stop S1 → rv(210,130) -->
<line class="transfer" x1="185" y1="175" x2="210" y2="130"/>
<!-- Stop S2 → rv(300,130) -->
<line class="transfer" x1="340" y1="165" x2="300" y2="130"/>
<!-- Stop S3 → rv(390,130) -->
<line class="transfer" x1="415" y1="170" x2="390" y2="130"/>
<!-- Stop S4 → rv(260,150) diagonal route -->
<line class="transfer" x1="240" y1="195" x2="260" y2="150"/>
<!-- Stop S5 → rv(140,300) -->
<line class="transfer" x1="115" y1="255" x2="140" y2="300"/>
<!-- Stop S6 → rv(330,300) -->
<line class="transfer" x1="355" y1="340" x2="330" y2="300"/>
<!-- Stop S7 → rv(510,300) -->
<line class="transfer" x1="490" y1="255" x2="510" y2="300"/>
<!-- Stop S8 → rv(440,240) diagonal -->
<line class="transfer" x1="465" y1="200" x2="440" y2="240"/>

<!-- ── Stop-to-stop transfer edges (nearby stops, gray dashed) ── -->
<line class="xfer-stop" x1="185" y1="175" x2="240" y2="195"/>
<line class="xfer-stop" x1="340" y1="165" x2="415" y2="170"/>
<line class="xfer-stop" x1="355" y1="340" x2="490" y2="255"/>

<!-- ── Walk edges: facilities → nearest stops (green dashed) ── -->
<!-- Fac F1 → S1 and S4 -->
<line class="walk-fac" x1="155" y1="230" x2="185" y2="175"/>
<line class="walk-fac" x1="155" y1="230" x2="240" y2="195"/>
<!-- Fac F2 → S2 and S3 -->
<line class="walk-fac" x1="378" y1="100" x2="340" y2="165"/>
<line class="walk-fac" x1="378" y1="100" x2="415" y2="170"/>
<!-- Fac F3 → S6 and S7 -->
<line class="walk-fac" x1="420" y1="370" x2="355" y2="340"/>
<line class="walk-fac" x1="420" y1="370" x2="490" y2="255"/>
<!-- Fac F4 → S7 and S8 -->
<line class="walk-fac" x1="560" y1="200" x2="490" y2="255"/>
<line class="walk-fac" x1="560" y1="200" x2="465" y2="200"/>

<!-- ── Stop nodes (purple circles) ── -->
<circle class="stop" id="s1" cx="185" cy="175" r="7" onclick="tip('Stop S1 — CasaBus, snapped to route 1 vertex at (210,130). Transfer walk edge: 52 m / 83 m/min = 0.6 min')"/>
<circle class="stop" id="s2" cx="340" cy="165" r="7" onclick="tip('Stop S2 — CasaBus, snapped to route 1 vertex at (300,130). Also near route 4 junction. Transfer walk: 36 m = 0.4 min')"/>
<circle class="stop" id="s3" cx="415" cy="170" r="7" onclick="tip('Stop S3 — Casaway, snapped to route 1 vertex at (390,130). Transfer walk: 43 m = 0.5 min')"/>
<circle class="stop" id="s4" cx="240" cy="195" r="7" onclick="tip('Stop S4 — CasaBus, snapped to route 2 diagonal vertex at (260,150). Transfer walk: 51 m = 0.6 min')"/>
<circle class="stop" id="s5" cx="115" cy="255" r="7" onclick="tip('Stop S5 — Casaway, snapped to route 3 vertex at (140,300). Transfer walk: 54 m = 0.6 min')"/>
<circle class="stop" id="s6" cx="355" cy="340" r="7" onclick="tip('Stop S6 — CasaBus, snapped to route 3 vertex at (330,300). Transfer walk: 27 m = 0.3 min')"/>
<circle class="stop" id="s7" cx="490" cy="255" r="7" onclick="tip('Stop S7 — Casaway, snapped to route 3 vertex at (510,300). Also within 150 m of S6 — stop-to-stop transfer edge added')"/>
<circle class="stop" id="s8" cx="465" cy="200" r="7" onclick="tip('Stop S8 — CasaBus, snapped to route 2 diagonal vertex at (440,240). Transfer walk: 45 m = 0.5 min')"/>

<!-- ── Facility nodes (teal diamonds via rotated rects) ── -->
<rect class="fac" id="f1" x="145" y="220" width="20" height="20" rx="3" transform="rotate(45 155 230)" onclick="tip('Facility F1 — within 1 km of stops S1 and S4. Walk edges inserted. Dijkstra from either stop reaches F1 directly.')"/>
<rect class="fac" id="f2" x="368" y="90"  width="20" height="20" rx="3" transform="rotate(45 378 100)" onclick="tip('Facility F2 — within 1 km of stops S2 and S3. Two entry points into the transit network.')"/>
<rect class="fac" id="f3" x="410" y="360" width="20" height="20" rx="3" transform="rotate(45 420 370)" onclick="tip('Facility F3 — within 1 km of stops S6 and S7. S7 also connects to route 2 diagonal via S8 transfer.')"/>
<rect class="fac" id="f4" x="550" y="190" width="20" height="20" rx="3" transform="rotate(45 560 200)" onclick="tip('Facility F4 — within 1 km of stops S7 and S8. Reachable from both route 2 and route 3 corridors.')"/>

<!-- ── Labels ── -->
<text class="tooltip" x="50"  y="118">R1</text>
<text class="tooltip" x="84"  y="52" >R2</text>
<text class="tooltip" x="60"  y="316">R3</text>
<text class="tooltip" x="306" y="46" >R4</text>

<text class="tooltip" x="168" y="172">S1</text>
<text class="tooltip" x="323" y="162">S2</text>
<text class="tooltip" x="420" y="168">S3</text>
<text class="tooltip" x="224" y="193">S4</text>
<text class="tooltip" x="98"  y="253">S5</text>
<text class="tooltip" x="338" y="338">S6</text>
<text class="tooltip" x="473" y="253">S7</text>
<text class="tooltip" x="449" y="198">S8</text>

<text class="tooltip" x="135" y="228">F1</text>
<text class="tooltip" x="358" y="88" >F2</text>
<text class="tooltip" x="400" y="358">F3</text>
<text class="tooltip" x="540" y="188">F4</text>

<!-- ── Legend ── -->
<line x1="30" y1="398" x2="54" y2="398" class="transit legend-line" stroke="#378ADD"/>
<text class="tooltip" x="58" y="402">Transit edge (route sequence)</text>
<line x1="200" y1="398" x2="224" y2="398" class="transfer legend-line" stroke="#7F77DD" stroke-dasharray="5 3"/>
<text class="tooltip" x="228" y="402">Stop → route vertex</text>
<line x1="360" y1="398" x2="384" y2="398" class="walk-fac legend-line" stroke="#1D9E75" stroke-dasharray="4 3"/>
<text class="tooltip" x="388" y="402">Facility walk edge</text>
<line x1="500" y1="398" x2="524" y2="398" class="xfer-stop legend-line" stroke="#888780" stroke-dasharray="3 3"/>
<text class="tooltip" x="528" y="402">Stop-to-stop transfer</text>
</svg>

<div id="info">Click any stop or facility node to inspect its connections.</div>
<script>
function tip(msg) { document.getElementById('info').textContent = msg; }
</script>
